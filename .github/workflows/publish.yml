name: 🚀 Build & Publish
# Runs on every push to main: opens/updates the release PR while changesets
# are pending, then tags and creates the GitHub release once it is merged.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Disable concurrent builds
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: 🔖Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 📦Setup PNPM
        uses: pnpm/action-setup@v6
      - name: 🌳Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 🛠️Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: 🦋Create Release Pull Request or Tag Release
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: 'ci(release): Version packages'
          title: 'ci(release): Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️Ensure release tag, major tag, and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="v$VERSION"
          # Only act once the current version has been tagged (i.e. the release PR is merged)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            MAJOR="v${VERSION%%.*}"
            git tag -f "$MAJOR" "$TAG"
            git push origin "$TAG" "$MAJOR" --force
            gh release view "$TAG" >/dev/null 2>&1 \
              || gh release create "$TAG" --title "$TAG" --generate-notes
          else
            echo "No tag for $TAG yet (release PR not merged) - skipping"
          fi
